name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} / Solidus ${{ matrix.solidus }} / Rails ${{ matrix.rails }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: "3.2"
            solidus: v4.6
            rails: "7.1"
          - ruby: "3.3"
            solidus: v4.7
            rails: "7.2"
          - ruby: "3.4"
            solidus: v4.7
            rails: "7.2"
    env:
      SOLIDUS_BRANCH: ${{ matrix.solidus }}
      RAILS_VERSION: ${{ matrix.rails }}
      RAILS_ENV: test
      SOLIDUS_PREFERENCES_MASTER_KEY: 0123456789abcdef0123456789abcdef
      COVERAGE: ${{ matrix.ruby == '3.3' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake extension:test_app
      - run: bundle exec rspec
      - run: bundle exec rubocop
      - run: bundle exec rake build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: gem install bundler-audit
      - run: bundle audit check --update
