name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Publish gem
    if: github.repository == 'futhr/solidus_nshift'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      SOLIDUS_BRANCH: v4.7
      RAILS_VERSION: "7.2"
      RAILS_ENV: test
      SOLIDUS_PREFERENCES_MASTER_KEY: 0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1, 2026-07-22
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Verify version tag
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = "tag"
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          version=$(ruby -Ilib -rsolidus_nshift/version -e 'print SolidusNshift::VERSION')
          test "$GITHUB_REF_NAME" = "v$version"
      - run: bundle exec rake extension:test_app
      - run: bin/rails zeitwerk:check
        working-directory: spec/dummy
      - run: bundle exec rspec
      - run: bundle exec rubocop
      - uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1, 2026-08-08
        with:
          attestations: true
