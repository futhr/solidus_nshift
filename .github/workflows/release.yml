name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Publish gem
    if: github.repository == 'futhr/solidus_nshift'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      SOLIDUS_BRANCH: v4.7
      RAILS_VERSION: "7.2"
      RAILS_ENV: test
      SOLIDUS_PREFERENCES_MASTER_KEY: 0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Verify version tag
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          version=$(ruby -Ilib -rsolidus_nshift/version -e 'print SolidusNshift::VERSION')
          test "$GITHUB_REF_NAME" = "v$version"
      - run: bundle exec rake extension:test_app
      - run: bin/rails zeitwerk:check
        working-directory: spec/dummy
      - run: bundle exec rspec
      - run: bundle exec rubocop
      - uses: rubygems/release-gem@v1
